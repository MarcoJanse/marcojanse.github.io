<!--
  Override of Chirpy's default favicons.html.
  Points at the existing favicon set in /assets/images/ instead of Chirpy's
  expected /assets/img/favicons/ path + filenames, so the pre-existing
  favicon files don't need to be regenerated or renamed.
-->

{% capture favicon_path %}{{ '/assets/images' | relative_url }}{% endcapture %}

<link rel="icon" type="image/png" sizes="32x32" href="{{ favicon_path }}/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ favicon_path }}/favicon-16x16.png">
<link rel="shortcut icon" href="{{ favicon_path }}/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="{{ favicon_path }}/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="{{ favicon_path }}/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="{{ favicon_path }}/android-chrome-512x512.png">
<!--
  No site.webmanifest exists yet, so the PWA "install" prompt on Android/desktop
  won't appear until one is added — everything else (including offline caching)
  still works without it. See https://realfavicongenerator.net/ if you want to
  generate one plus a fresh icon set later.
-->
